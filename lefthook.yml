pre-commit:
  commands:
    format:
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,svelte,json,jsonc,yaml,yml,md,html,css,scss}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,svelte}'
      run: pnpm exec oxlint --type-aware --fix --deny-warnings {staged_files}
      stage_fixed: true
